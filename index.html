<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>www</title>
<style>
  :root {
    --bg: #0f1115;
    --text: #f2f1ec;
    --text-dim: #9a9689;
    --accent: #d9a25c;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    text-align: center;
    padding: 24px;
  }

  main {
    max-width: 480px;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    letter-spacing: 0.08em;
    margin: 0 0 12px;
  }

  p {
    color: var(--text-dim);
    font-size: 1rem;
    line-height: 1.6;
    margin: 0;
  }

  .badge {
    display: inline-block;
    margin-top: 24px;
    padding: 6px 14px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    color: var(--accent);
    font-size: 0.8rem;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <main>
    <h1>www</h1>
    <p>入口網頁建置中，敬請期待。</p>
    <span class="badge">Coming soon</span>
  </main>
</body>
</html>
